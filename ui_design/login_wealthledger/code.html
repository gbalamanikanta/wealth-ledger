<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>WealthLedger | Institutional Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-fixed": "#dbe1ff",
                      "on-secondary": "#ffffff",
                      "on-surface": "#0b1c30",
                      "on-primary-container": "#7c839b",
                      "secondary-container": "#316bf3",
                      "surface-container": "#e5eeff",
                      "on-tertiary-fixed-variant": "#005236",
                      "on-tertiary-container": "#009668",
                      "primary-container": "#131b2e",
                      "surface": "#f8f9ff",
                      "tertiary-fixed-dim": "#4edea3",
                      "on-primary-fixed": "#131b2e",
                      "secondary-fixed-dim": "#b4c5ff",
                      "on-secondary-fixed-variant": "#003ea8",
                      "on-primary-fixed-variant": "#3f465c",
                      "tertiary-fixed": "#6ffbbe",
                      "error": "#ba1a1a",
                      "surface-bright": "#f8f9ff",
                      "on-secondary-container": "#fefcff",
                      "surface-tint": "#565e74",
                      "surface-container-lowest": "#ffffff",
                      "on-error": "#ffffff",
                      "inverse-on-surface": "#eaf1ff",
                      "on-tertiary": "#ffffff",
                      "error-container": "#ffdad6",
                      "primary-fixed-dim": "#bec6e0",
                      "on-tertiary-fixed": "#002113",
                      "on-error-container": "#93000a",
                      "surface-container-low": "#eff4ff",
                      "on-secondary-fixed": "#00174b",
                      "outline": "#76777d",
                      "primary-fixed": "#dae2fd",
                      "surface-dim": "#cbdbf5",
                      "on-primary": "#ffffff",
                      "on-background": "#0b1c30",
                      "tertiary-container": "#002113",
                      "surface-container-high": "#dce9ff",
                      "background": "#f8f9ff",
                      "surface-variant": "#d3e4fe",
                      "tertiary": "#000000",
                      "primary": "#000000",
                      "surface-container-highest": "#d3e4fe",
                      "outline-variant": "#c6c6cd",
                      "secondary": "#0051d5",
                      "inverse-surface": "#213145",
                      "inverse-primary": "#bec6e0",
                      "on-surface-variant": "#45464d"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "xs": "4px",
                      "xl": "64px",
                      "md": "24px",
                      "gutter": "24px",
                      "base": "8px",
                      "margin": "32px",
                      "lg": "40px",
                      "sm": "12px"
              },
              "fontFamily": {
                      "label-sm": ["Inter"],
                      "body-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "stat-lg": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-lg": ["Inter"],
                      "display-md": ["Inter"],
                      "display-lg": ["Inter"],
                      "body-lg": ["Inter"]
              },
              "fontSize": {
                      "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                      "stat-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                      "headline-lg": ["30px", {"lineHeight": "38px", "fontWeight": "600"}],
                      "label-lg": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "display-md": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
        body {
            background-color: #f8f9ff;
            font-family: 'Inter', sans-serif;
        }
        .login-card {
            box-shadow: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-md text-on-surface">
<div class="w-full max-w-[440px]">
<!-- Brand Identity Header -->
<div class="text-center mb-lg">
<div class="inline-flex items-center justify-center p-sm bg-secondary-container rounded-xl mb-md">
<span class="material-symbols-outlined text-on-secondary-container !text-[32px]" data-icon="account_balance">account_balance</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">WealthLedger</h1>
<p class="font-label-lg text-label-lg text-on-primary-container">Institutional Private Wealth Management</p>
</div>
<!-- Login Card -->
<div class="login-card bg-surface-container-lowest border border-outline-variant rounded-xl p-lg">
<div class="mb-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Enter your credentials to access your portal</p>
</div>
<form class="space-y-md">
<!-- Username/Email Field -->
<div class="space-y-xs">
<label class="block font-label-lg text-label-lg text-on-surface" for="email">Username or Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline !text-[20px]" data-icon="mail">mail</span>
</div>
<input class="block w-full pl-xl pr-md py-sm bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface placeholder-on-primary-container focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none" id="email" name="email" placeholder="name@wealthledger.com" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="block font-label-lg text-label-lg text-on-surface" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline !text-[20px]" data-icon="lock">lock</span>
</div>
<input class="block w-full pl-xl pr-md py-sm bg-surface-container-low border border-outline-variant rounded-lg font-body-md text-on-surface placeholder-on-primary-container focus:ring-2 focus:ring-secondary focus:border-secondary transition-all outline-none" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Remember Me Toggle -->
<div class="flex items-center">
<input class="h-4 w-4 rounded border-outline-variant text-secondary focus:ring-secondary transition-all" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-sm block font-label-sm text-label-sm text-on-surface-variant" for="remember-me">
                        Remember this device for 30 days
                    </label>
</div>
<!-- Action Button -->
<div class="pt-sm">
<button class="w-full h-[48px] bg-secondary text-on-secondary rounded-lg font-label-lg text-label-lg hover:bg-secondary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-sm" type="submit">
                        Sign In
                        <span class="material-symbols-outlined !text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Confidential system access. 
                <a class="text-secondary font-label-lg text-label-lg ml-xs hover:underline" href="#">Support Center</a>
</p>
</div>
</div>
<!-- Background Decorative Element (Subtle) -->
<div class="fixed inset-0 -z-10 overflow-hidden">
<div class="absolute -top-[10%] -left-[5%] w-[40%] h-[40%] bg-surface-container blur-[120px] rounded-full opacity-50"></div>
<div class="absolute -bottom-[10%] -right-[5%] w-[40%] h-[40%] bg-secondary-fixed-dim blur-[120px] rounded-full opacity-30"></div>
</div>
</body></html>
